<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday Lists</title>
<meta name="description" content="Packing and shopping checklists for family holidays. Works offline.">
<meta name="theme-color" content="#f6f7f9" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Holiday">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b63c4'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface2:#eef1f5;--text:#111827;--muted:#525d6c;--border:#d5dbe3;
  --accent:#0b63c4;--accent-ink:#fff;--accent-soft:#e4efff;
  --c:#b42318;--c-bg:#fdebea;--i:#8a5200;--i-bg:#fff1d6;--n:#4b5563;--n-bg:#eceff3;
  --ok:#0f7a55;--ok-bg:#dcf4e9;--warn-bg:#fff6dd;--warn-bd:#d99a00;--warn-ink:#4f3500;
  --buy:#6d28d9;--buy-bg:#f0e9ff;--home:#0f6e5a;--home-bg:#e1f5ef;--host:#9a3412;--host-bg:#ffeadb;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);--toast:#1f2937;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--surface:#171b21;--surface2:#222831;--text:#eef1f5;--muted:#a5aebb;--border:#2f3642;
  --accent:#5aa9ff;--accent-ink:#071425;--accent-soft:#16263d;
  --c:#ff8f85;--c-bg:#3b1714;--i:#ffc766;--i-bg:#3a2a0c;--n:#c3cad4;--n-bg:#262c35;
  --ok:#5fd3a5;--ok-bg:#0f2e22;--warn-bg:#33270a;--warn-bd:#c48a00;--warn-ink:#ffdf99;
  --buy:#c4b1ff;--buy-bg:#2a2047;--home:#7ee0c4;--home-bg:#123129;--host:#ffb38a;--host-bg:#3a2010;
  --shadow:0 1px 2px rgba(0,0,0,.4);--toast:#333c4a;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1216;--surface:#171b21;--surface2:#222831;--text:#eef1f5;--muted:#a5aebb;--border:#2f3642;
  --accent:#5aa9ff;--accent-ink:#071425;--accent-soft:#16263d;
  --c:#ff8f85;--c-bg:#3b1714;--i:#ffc766;--i-bg:#3a2a0c;--n:#c3cad4;--n-bg:#262c35;
  --ok:#5fd3a5;--ok-bg:#0f2e22;--warn-bg:#33270a;--warn-bd:#c48a00;--warn-ink:#ffdf99;
  --buy:#c4b1ff;--buy-bg:#2a2047;--home:#7ee0c4;--home-bg:#123129;--host:#ffb38a;--host-bg:#3a2010;
  --shadow:0 1px 2px rgba(0,0,0,.4);--toast:#333c4a;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.2}
.wrap{max-width:640px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14.5px;color:var(--muted)}

/* buttons */
.btn{min-height:48px;padding:8px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--c);border-color:var(--c)}
.btn.block{width:100%;margin-top:10px}
.btn.sm{min-height:44px;padding:4px 14px;font-size:15px}
.iconbtn{flex:none;min-width:44px;height:44px;border:0;background:transparent;font-size:26px;line-height:1;border-radius:12px;display:grid;place-items:center}
.link{border:0;background:none;color:var(--accent);font-weight:650;padding:10px 4px;min-height:44px;text-decoration:underline}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row2 .btn{margin:0}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* home */
.home-h{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 16px 4px}
.home-h h1{margin:0;font-size:30px}
.home-h p{margin:2px 0 0}
.home-main{padding:4px 16px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.tabs .card{margin:12px}
.card h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card p{margin:6px 0}
.tripcard{display:block;width:100%;text-align:left}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-top h2{margin:0;font-size:22px}
.tc-stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:15px;font-weight:600;margin-top:8px!important}
.crit-txt{color:var(--c)}
.ok-txt{color:var(--ok)}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15px;color:var(--text)}
.note.warnish{background:var(--warn-bg);color:var(--warn-ink)}

/* progress */
.pbar{display:block;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .3s}
.pbar.lg{height:14px}

/* trip header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.bar1{display:flex;align-items:center;gap:4px;padding:4px 6px;min-height:52px}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:4px}
.ttl b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:13px;color:var(--muted)}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:17px;padding:0 42px 0 36px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.qx{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 8px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:15px;font-weight:600;white-space:nowrap}
.chip .n{font-weight:500;color:var(--muted);font-size:13px;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.85}
.chip.chip-done:not([aria-pressed="true"]){border-color:var(--ok)}
.chip.chip-done .n::before{content:"✓ "}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:650}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px}
.tabs{padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* criticality + source badges: shape + letter + colour */
.crit{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:36px;height:24px;padding:0 5px;border-radius:6px;font-size:12px;font-weight:800;white-space:nowrap}
.crit.lg{height:30px;font-size:15px;padding:0 10px}
.crit-c{background:var(--c-bg);color:var(--c)}
.crit-i{background:var(--i-bg);color:var(--i)}
.crit-n{background:var(--n-bg);color:var(--n)}
.src{flex:none;font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 6px;border-radius:6px;white-space:nowrap}
.src-buy{background:var(--buy-bg);color:var(--buy)}
.src-home{background:var(--home-bg);color:var(--home)}
.src-host{background:var(--host-bg);color:var(--host)}
.src-other{background:var(--n-bg);color:var(--n)}

/* list */
.lsum{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 14px;font-size:14.5px;color:var(--muted);min-height:44px}
.group{margin:0 0 6px}
.ghead{position:sticky;top:var(--hdr,150px);z-index:5;margin:0}
.ghead button{width:100%;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;border-bottom:1px solid var(--border);background:var(--surface2);font-size:15.5px;font-weight:750;text-align:left}
.gname{flex:1}
.gcount{font-size:13.5px;font-weight:600;color:var(--muted)}
.chev{transition:transform .2s;color:var(--muted)}
.ghead button[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.rows{list-style:none;margin:0;padding:0}
.row{background:var(--surface);border-bottom:1px solid var(--border);transition:opacity .45s}
.row.is-c{box-shadow:inset 4px 0 var(--c)}
.rline{display:flex;align-items:stretch;min-height:46px}
.rmain{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:4px 2px 4px 12px;border:0;background:none;text-align:left}
.name{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.2;font-size:16px}
.wi{color:var(--warn-bd);font-weight:800}
.row.open .name{-webkit-line-clamp:unset;display:block;padding:10px 0;font-weight:650}
.tags{display:flex;gap:6px;align-items:center;flex:none}
.qty{font-size:13px;color:var(--muted);max-width:4.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{flex:none;position:relative;width:54px;display:grid;place-items:center;cursor:pointer}
.tick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.box{width:28px;height:28px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;background:var(--surface)}
.tick input:checked+.box{background:var(--ok);border-color:var(--ok)}
.tick input:checked+.box::after{content:"";width:7px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.tick input:focus-visible+.box{outline:3px solid var(--accent);outline-offset:2px}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.row.done .crit,.row.done .tags{opacity:.5}
.row.leaving{opacity:.15}
.details{padding:0 14px 12px 57px;font-size:15.5px}
.dl{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.why,.notes{margin:6px 0}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);border-left-width:5px;border-radius:10px;padding:8px 10px;margin:8px 0;color:var(--warn-ink)}
.warn .dl{color:var(--warn-ink)}
mark{background:transparent;color:var(--warn-ink);border:1px dashed var(--warn-bd);padding:0 3px;border-radius:4px;font-weight:800}
.dmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted);margin:8px 0}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.lfoot{padding:8px 12px 20px}

/* dashboard */
.dhead{padding:14px 16px 0}
.dhead h1{margin:0;font-size:28px}
.dhead p{margin:4px 0 8px;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pct{font-size:44px;font-weight:800;line-height:1}
.quick{display:grid;gap:8px;margin-top:14px}
.quick .btn{justify-content:space-between;min-height:52px}
.crit-card{border-color:var(--c);border-width:2px}
.crit-card h2 b{margin-left:auto;background:var(--c);color:var(--surface);border-radius:99px;padding:1px 10px;font-size:15px}
.crit-card .rows{margin:0 -14px}
.crit-card .row:last-child{border-bottom:0}
.ok{color:var(--ok);font-weight:650}
.stat{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;min-height:52px}
.stat:last-child{border-bottom:0}
.slbl{display:flex;align-items:center;gap:8px;font-weight:600}
.snum{font-size:14px;color:var(--muted);font-weight:600}
.stat .pbar{grid-column:1/-1;height:8px;margin-top:4px}

/* focus */
.fwrap{display:flex;flex-direction:column;gap:10px;height:calc(100dvh - var(--hdr,150px) - 76px - env(safe-area-inset-bottom));padding:10px 12px}
.fprog{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.fscope{color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fwrap>.pbar{margin:0}
.fcard{flex:1;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s,opacity .2s;overflow:auto;position:relative}
.fcard.is-packed{border-color:var(--ok);border-width:2px}
.fcard[data-hint="done"]{outline:4px solid var(--ok)}
.fcard[data-hint="skip"]{outline:4px solid var(--muted)}
.fcat{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fbadges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.fbadges .src{font-size:13px;padding:6px 9px}
.fcard h2{font-size:26px;margin:14px 0 8px}
.fqty{font-size:18px;margin:4px 0 10px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
.factions{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:10px}
.factions .btn{min-height:60px;font-size:18px;padding:8px}
.fend{text-align:center;padding:24px 16px}
.fend .big-ic{font-size:48px}

/* more */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.seg button{min-height:48px;border:0;background:var(--surface);font-weight:650;font-size:15px}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
textarea.out{font-family:ui-monospace,Menlo,monospace;font-size:13px!important;word-break:break-all}
.check{display:flex!important;align-items:center;gap:10px;font-weight:600;min-height:44px;margin:8px 0}
.check input{width:24px;height:24px;min-height:0;flex:none}

/* sheet (bottom dialog) + forms */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;background:var(--surface);color:var(--text);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 0 16px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h h2{margin:0;font-size:20px}
.sheet-b{padding:4px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-b h3{font-size:17px;margin:20px 0 4px}
label{display:block;font-weight:650;font-size:15px;margin:12px 0 4px}
dialog input:not([type=checkbox]):not([type=file]),.card input:not([type=checkbox]),select,textarea{width:100%;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);min-height:46px}
textarea{resize:vertical}
.difflist{margin:6px 0;padding-left:20px}
details summary{min-height:44px;display:flex;align-items:center;font-weight:650;color:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:50;background:var(--toast);color:#fff;padding:8px 8px 8px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:15.5px;min-height:44px}
#toast .tbtn{border:0;background:none;color:#8fc4ff;font-weight:800;min-height:40px;padding:0 10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="home" hidden>
  <header class="home-h wrap">
    <div><h1>Holiday lists</h1><p class="muted">Packing &amp; shopping checklists</p></div>
    <button class="iconbtn" data-act="theme" aria-label="Change light or dark theme">◐</button>
  </header>
  <main class="wrap home-main">
    <div id="homeList"></div>
    <button class="btn primary block" data-act="newtrip">＋ New trip</button>
    <button class="btn block" data-act="paste">Paste a shared link or code</button>
    <button class="btn block" id="seedBtn" data-act="seed" hidden>Add the Barbados sample list</button>
    <p class="note"><b>Saved on this device only.</b> There are no accounts: lists and ticks live in this browser. To copy them to another phone, open a trip and use <i>More → Share this list</i> or <i>Send my ticks</i>.</p>
  </main>
</div>

<div id="trip" hidden>
  <header class="top" id="tripHdr"><div class="wrap">
    <div class="bar1">
      <button class="iconbtn" data-act="back" aria-label="All trips">‹</button>
      <div id="tripTitle" class="ttl"></div>
      <div id="searchBox" class="search" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search items &amp; notes" aria-label="Search items and notes" autocomplete="off" enterkeyhint="search">
        <button id="qx" class="qx" aria-label="Clear search" hidden>✕</button>
      </div>
      <button class="iconbtn" data-act="add" aria-label="Add an item">＋</button>
    </div>
    <div id="filters" hidden>
      <div class="chips" id="fchips" role="group" aria-label="Filters"></div>
      <div class="chips" id="cchips" role="group" aria-label="Categories"></div>
    </div>
  </div></header>
  <main class="wrap tabs">
    <section id="tab-dash" hidden></section>
    <section id="tab-list" hidden></section>
    <section id="tab-focus" hidden></section>
    <section id="tab-more" hidden></section>
  </main>
  <nav class="nav" aria-label="Sections"><div class="nav-in">
    <button data-act="tab" data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
    <button data-act="tab" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span>List</span></button>
    <button data-act="tab" data-v="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg><span>Focus</span></button>
    <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>More</span></button>
  </div></nav>

/* ---------- Constants & helpers ---------- */
const KEY = 'holidayLists.v1';
const COLS = ['id','category','item','qty','source','criticality','why_critical','notes','packed','sort_order'];
const CRIT = [
  {k:'Critical', ic:'▲', ab:'C', cls:'c'},
  {k:'Important', ic:'●', ab:'I', cls:'i'},
  {k:'Nice to have', ic:'◇', ab:'N', cls:'n'}];
const SRC = [
  {k:'Need to buy', ab:'BUY', cls:'buy', lbl:'Need to buy'},
  {k:'Have at home', ab:'HOME', cls:'home', lbl:'Have at home'},
  {k:'Provided - check with host', ab:'HOST', cls:'host', lbl:'Provided by host'}];
const WARN_RE = /customs|declare|illegal|permit|confiscat|quarantine|dutiable|cannot be imported|camouflage/i;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = v => String(v ?? '').trim();
const clone = o => JSON.parse(JSON.stringify(o));
const newUid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const critOf = it => CRIT.find(c => c.k === it.criticality) || CRIT[2];
const srcOf = it => SRC.find(s => s.k === it.source) || {k:it.source, ab:'OTHER', cls:'other', lbl:it.source || '—'};
const isWarn = it => WARN_RE.test(it.notes) && !/not a customs issue/i.test(it.notes);
const rich = s => h(s).replace(/\bUNVERIFIED\b/g, '<mark>UNVERIFIED</mark>');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function matchOpt(v, opts) {
  v = clean(v).toLowerCase();
  if (!v) return null;
  const o = opts.find(o => o.k.toLowerCase() === v) || opts.find(o => o.k.toLowerCase().startsWith(v.split(/[\s-]/)[0]));
  return o ? o.k : null;
}

/* ---------- Trips & storage ---------- */
function normItems(rows) {
  const used = new Set();
  let max = 0;
  rows.forEach(r => { const n = parseInt(r.id, 10); if (n > max) max = n; });
  return rows.map((r, i) => {
    let id = parseInt(r.id, 10);
    if (!Number.isFinite(id) || used.has(id)) id = ++max;
    used.add(id);
    const so = parseFloat(r.sort_order);
    return {
      id, category: clean(r.category) || 'General', item: clean(r.item), qty: clean(r.qty),
      source: matchOpt(r.source, SRC) || clean(r.source) || 'Have at home',
      criticality: matchOpt(r.criticality, CRIT) || 'Nice to have',
      why_critical: clean(r.why_critical), notes: clean(r.notes),
      sort_order: Number.isFinite(so) ? so : i + 1,
      _packed: /^(y|yes|true|1|x|✓)$/i.test(clean(r.packed))
    };
  }).filter(it => it.item);
}

function newTrip(meta, rows, builtin) {
  const items = normItems(rows), state = {};
  items.forEach(it => { if (it._packed) state[it.id] = {p:1, t:0}; delete it._packed; });
  return {
    uid: meta.uid || newUid(), name: meta.name || 'My trip', sub: meta.sub || '',
    start: meta.start || '', end: meta.end || '', builtin: !!builtin, items,
    orig: builtin ? null : clone(items), origState: clone(state), state, created: Date.now()
  };
}

function originalOf(t) {
  if (t.builtin) { const n = newTrip(SEED_META, SEED, true); return {items:n.items, state:n.state}; }
  return {items: clone(t.orig || []), state: clone(t.origState || {})};
}

let saveWarned = false;
function persist(d = DB) {
  try { localStorage.setItem(KEY, JSON.stringify(d)); return true; }
  catch (e) {
    if (!saveWarned) { saveWarned = true; setTimeout(() => toast('Couldn’t save on this device (private browsing or storage full). Changes may be lost on refresh.', null, null, 7000), 0); }
    return false;
  }
}

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!d || !Array.isArray(d.trips)) d = {trips: []};
  d.settings = Object.assign({theme:'system', device:'', last:null}, d.settings);
  if (!d.seeded) {
    if (!d.trips.some(t => t.uid === SEED_META.uid)) d.trips.unshift(newTrip(SEED_META, SEED, true));
    d.seeded = true;
    persist(d);
  }
  return d;
}

const DB = load();
const getTrip = uid => DB.trips.find(t => t.uid === uid);
const itemById = (t, id) => t.items.find(i => i.id === +id);
const isPacked = (t, id) => !!(t.state[id] && t.state[id].p);
const countPacked = (t, its = t.items) => its.filter(i => isPacked(t, i.id)).length;
function setPacked(t, id, p) { t.state[id] = {p: p ? 1 : 0, t: Date.now()}; persist(); }

function catOrder(t) {
  const o = [];
  t.items.forEach(it => { if (!o.includes(it.category)) o.push(it.category); });
  return o;
}
function sorted(t) {
  const o = catOrder(t);
  return t.items.slice().sort((a, b) => o.indexOf(a.category) - o.indexOf(b.category) || a.sort_order - b.sort_order || a.id - b.id);
}
function maxSort(t, cat, exceptId) {
  return Math.max(0, ...t.items.filter(i => i.category === cat && i.id !== exceptId).map(i => i.sort_order));
}

/* ---------- Dates ---------- */
const fmtDay = iso => new Date(iso + 'T00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
function dateRange(t) {
  if (!t.start) return '';
  const y = new Date((t.end || t.start) + 'T00:00').getFullYear();
  return fmtDay(t.start) + (t.end && t.end !== t.start ? ' – ' + fmtDay(t.end) : '') + ' ' + y;
}
function countdown(t) {
  if (!t.start) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const s = new Date(t.start + 'T00:00'), e = new Date((t.end || t.start) + 'T00:00');
  const d = Math.round((s - today) / 864e5);
  if (d > 1) return `Leaves in ${d} days`;
  if (d === 1) return 'Leaves tomorrow';
  if (d === 0) return 'Leaves today';
  return today <= e ? 'Trip underway' : 'Trip finished';
}
const fmtWhen = ts => ts ? new Date(ts).toLocaleString('en-GB', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : 'unknown time';

const UI = {trip:null, tab:'dash', q:'', st:'', crit:'', src:'', cat:'', open:new Set(), collapsed:new Set(), focus:{key:'', queue:[], i:0}};

const filtersActive = () => !!(UI.q || UI.st || UI.crit || UI.src || UI.cat);
function matches(t, it) {
  if (UI.cat && it.category !== UI.cat) return false;
  if (UI.crit && it.criticality !== UI.crit) return false;
  if (UI.src && it.source !== UI.src) return false;
  if (UI.st === 'todo' && isPacked(t, it.id)) return false;
  if (UI.q) {
    const hay = [it.item, it.notes, it.category, it.why_critical, it.qty].join(' ').toLowerCase();
    if (!UI.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

/* ---------- Views ---------- */
function showHome() {
  UI.trip = null;
  DB.settings.last = null;
  persist();
  closeSheet();
  $('#trip').hidden = true;
  $('#home').hidden = false;
  document.title = 'Holiday Lists';
  renderHome();
  window.scrollTo(0, 0);
}

function openTrip(uid, {push = true, tab} = {}) {
  const t = getTrip(uid);
  if (!t) return showHome();
  if (UI.trip !== t) { resetFilters(); UI.open.clear(); UI.collapsed.clear(); UI.focus.key = ''; }
  UI.trip = t;
  $('#home').hidden = true;
  $('#trip').hidden = false;
  if (push) history.pushState({v:'trip', uid}, '');
  setTab(tab || 'dash');
}

function goHome() {
  if (history.state && history.state.v === 'trip') history.back();
  else showHome();
}

function setTab(tab) {
  UI.tab = tab;
  const t = UI.trip;
  DB.settings.last = {uid: t.uid, tab};
  persist();
  $$('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === tab ? 'page' : 'false'));
  ['dash', 'list', 'focus', 'more'].forEach(k => { $('#tab-' + k).hidden = k !== tab; });
  const filt = tab === 'list' || tab === 'focus';
  $('#filters').hidden = !filt;
  $('#searchBox').hidden = !filt;
  $('#tripTitle').hidden = filt;
  renderTitle();
  if (filt) renderChips();
  renderTab();
  window.scrollTo(0, 0);
  measureHdr();
}

function renderTab() {
  if (!UI.trip) return;
  ({dash:renderDash, list:renderList, focus:renderFocus, more:renderMore})[UI.tab]();
}

let tabTimer;
function rerenderSoon(ms = 650) {

function renderTitle() {

function focusDone() {
  const t = UI.trip, F = UI.focus, id = F.queue[F.i];
  if (id == null) return;
  if (isPacked(t, id)) { setPacked(t, id, false); }
  else { setPacked(t, id, true); F.i++; }
  renderTitle(); renderChips(); renderFocus();
}
function focusSkip() { if (UI.focus.i < UI.focus.queue.length) { UI.focus.i++; renderFocus(); } }
function focusBack() { if (UI.focus.i > 0) { UI.focus.i--; renderFocus(); } }

function bindSwipe(card) {
  let x0 = null, y0 = 0, dx = 0, horiz = false;
  card.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = false;
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    const dy = e.clientY - y0;
    if (!horiz) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { x0 = null; card.style.transition = ''; return; }
      if (Math.abs(dx) > 12) { horiz = true; try { card.setPointerCapture(e.pointerId); } catch (_) {} }
    }
    if (horiz) {
      card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
      card.dataset.hint = dx > 60 ? 'done' : dx < -60 ? 'skip' : '';
    }
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    card.style.transition = '';
    delete card.dataset.hint;
    if (horiz && Math.abs(dx) > 90) {
      card.style.transform = `translateX(${dx > 0 ? 120 : -120}%)`;
      card.style.opacity = '0';
      setTimeout(dx > 0 ? focusDone : focusSkip, 160);
    } else card.style.transform = '';
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------- Share links & sync codes ---------- */
function b64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const s = atob(str), b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try {
      const out = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
      return 'z' + b64u(new Uint8Array(out));
    } catch (e) {}
  }
  return 'j' + b64u(bytes);
}
async function unpack(str) {
  const bytes = unb64u(str.slice(1));
  if (str[0] === 'z') return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  if (str[0] === 'j') return JSON.parse(new TextDecoder().decode(bytes));
  throw new Error('bad code');
}

function tripPayload(t, ticks) {
  const c = catOrder(t), s = {};
  if (ticks) for (const [id, v] of Object.entries(t.state)) s[id] = [v.p, v.t];
  return {k:'t', u:t.uid, n:t.name, sub:t.sub, st:t.start, en:t.end, d:DB.settings.device, c,
    i: t.items.map(it => [it.id, c.indexOf(it.category), it.item, it.qty, it.source, it.criticality, it.why_critical, it.notes, it.sort_order]),
    s: ticks ? s : null};
}

async function statusPayload(t) {
  const s = {};
  for (const [id, v] of Object.entries(t.state)) if (v.t) s[id] = [v.p, v.t];
  return 'HLS1.' + await pack({k:'s', u:t.uid, n:t.name, d:DB.settings.device, at:Date.now(), s});
}

async function readCode(raw) {
  const s = clean(raw).replace(/\s+/g, '');
  let m;
  try {
    if ((m = s.match(/#t=([\w-]+)/))) {
      const d = await unpack(m[1]);
      if (d.k === 't' && Array.isArray(d.i) && Array.isArray(d.c)) return {kind:'trip', data:d};
    } else if ((m = s.match(/#s=([\w-]+)/)) || (m = s.match(/HLS1\.([\w-]+)/))) {
      const d = await unpack(m[1]);
      if (d.k === 's' && d.s) return {kind:'status', data:d};
    }
  } catch (e) {}
  return null;
}

function tripFromPayload(d) {
  const rows = d.i.map(a => ({id:a[0], category:d.c[a[1]], item:a[2], qty:a[3], source:a[4], criticality:a[5], why_critical:a[6], notes:a[7], sort_order:a[8]}));
  const t = newTrip({uid:d.u, name:d.n, sub:d.sub, start:d.st, end:d.en}, rows, false);
  if (d.s) for (const [id, [p, ts]] of Object.entries(d.s)) t.state[id] = {p, t:ts};
  return t;
}

function diffStatus(t, d) {
  const apply = [], ids = new Set(t.items.map(i => i.id));
  let on = 0, off = 0, missing = 0;
  const names = [];
  for (const [id, [p, ts]] of Object.entries(d.s)) {
    if (!ids.has(+id)) { if (p) missing++; continue; }
    const cur = t.state[id];
    if (ts > (cur ? cur.t : 0)) {
      apply.push([id, p, ts]);
      if (p !== (cur ? cur.p : 0)) { p ? on++ : off++; names.push((p ? '✓ ' : '☐ ') + itemById(t, id).item); }
    }
  }
  return {apply, on, off, missing, names};
}

function importTripSheet(d) {
  const exists = getTrip(d.u), ticks = d.s ? Object.values(d.s).filter(v => v[0]).length : 0;
  openSheet('Add a shared list', `
    <p><b>${h(d.n)}</b>${d.sub ? ' · ' + h(d.sub) : ''}<br>${plural(d.i.length, 'item')} in ${plural(d.c.length, 'category').replace('categorys', 'categories')}${d.s ? ` · ${plural(ticks, 'item')} ticked${d.d ? ' on ' + h(d.d) : ''}` : ''}.</p>
    ${exists ? `<p class="note">This list is already on this phone (“${h(exists.name)}”).</p>
      <button class="btn primary block" id="tUpd">Update my copy and merge ticks</button>
      <button class="btn block" id="tCopy">Add as a separate copy</button>`
    : '<button class="btn primary block" id="tAdd">Add to this phone</button>'}
    <button class="btn block" data-act="closesheet">Cancel</button>`, () => {
    const add = asCopy => {
      const t = tripFromPayload(d);
      if (asCopy) { t.uid = newUid(); t.name += ' (copy)'; }
      DB.trips.push(t); persist(); closeSheet();
      toast(`Added “${t.name}”`);
      openTrip(t.uid);
    };
    if ($('#tAdd')) $('#tAdd').onclick = () => add(false);
    if ($('#tCopy')) $('#tCopy').onclick = () => add(true);
    if ($('#tUpd')) $('#tUpd').onclick = () => {
      const inc = tripFromPayload(d);
      exists.items = inc.items;
      Object.assign(exists, {name:inc.name, sub:inc.sub, start:inc.start, end:inc.end});
      let n = 0;
      for (const [id, v] of Object.entries(inc.state)) {
        const cur = exists.state[id];
        if (!cur || v.t > cur.t) { exists.state[id] = v; n++; }
      }
      persist(); closeSheet();
      toast(`Updated “${exists.name}” · ${plural(n, 'tick')} merged`);
      if (UI.trip === exists) { resetFilters(); setTab(UI.tab); } else openTrip(exists.uid);
    };
  });
}

function statusSheet(d) {
  let t = getTrip(d.u), other = false;
  if (!t && UI.trip) { t = UI.trip; other = true; }
  if (!t) {
    openSheet('Import ticks', `<p>These ticks belong to “${h(d.n)}”, which isn’t on this phone yet. Ask for that list’s share link first.</p><button class="btn block" data-act="closesheet">OK</button>`);
    return;
  }
  const df = diffStatus(t, d);
  openSheet('Import ticks', `
    <p>From <b>${h(d.d || 'another device')}</b>, sent ${fmtWhen(d.at)}, for <b>${h(t.name)}</b>.</p>
    ${other ? `<p class="note warnish">This code came from a different list (“${h(d.n)}”). Items will be matched by their id number.</p>` : ''}
    ${df.apply.length ? `<ul class="difflist"><li><b>${df.on}</b> will become packed</li><li><b>${df.off}</b> will become unpacked</li></ul>
      ${df.names.length ? `<details><summary>See which items</summary><ul class="difflist">${df.names.map(n => `<li>${h(n)}</li>`).join('')}</ul></details>` : ''}
      <button class="btn primary block" id="sApply">Merge these ticks</button>`
    : '<p class="ok">✓ Already up to date. Nothing to change.</p>'}
    ${df.missing ? `<p class="small">${plural(df.missing, 'ticked item')} aren’t in your list and will be ignored.</p>` : ''}
    <button class="btn block" data-act="closesheet">${df.apply.length ? 'Cancel' : 'Close'}</button>`, () => {
    const b = $('#sApply');
    if (b) b.onclick = () => {
      df.apply.forEach(([id, p, ts]) => { t.state[id] = {p, t:ts}; });
      persist(); closeSheet();
      toast(`Merged: ${df.on} packed, ${df.off} unpacked`);
      if (UI.trip === t) { renderTitle(); if (!$('#filters').hidden) renderChips(); UI.focus.key = ''; renderTab(); }
      else openTrip(t.uid);
    };
  });
}

function pasteSheet(title, intro) {
  openSheet(title, `<p>${intro}</p>
    <textarea id="pTxt" rows="5" aria-label="Link or code" placeholder="Paste here"></textarea>
    <button class="btn primary block" id="pGo">Continue</button>
    <p id="pMsg" class="crit-txt" role="status"></p>`, () => {
    $('#pGo').onclick = async () => {
      const r = await readCode($('#pTxt').value);
      if (!r) { $('#pMsg').textContent = 'That link or code couldn’t be read. Make sure you copied all of it.'; return; }
      r.kind === 'trip' ? importTripSheet(r.data) : statusSheet(r.data);
    };
  });
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

function rowsFromCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return {error:'That file has no rows to import.'};
  const head = rows[0].map(x => x.trim().toLowerCase().replace(/[\s-]+/g, '_'));
  if (!head.includes('item')) return {error:`No “item” column found. Columns seen: ${head.join(', ') || 'none'}.`};
  return {rows: rows.slice(1).map(r => Object.fromEntries(head.map((k, i) => [k, r[i] ?? ''])))};
}

const csvCell = v => /[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
function toCSV(t) {
  return '﻿' + [COLS.join(','), ...sorted(t).map(it => COLS.map(k => csvCell(k === 'packed' ? (isPacked(t, it.id) ? 'yes' : 'no') : it[k])).join(','))].join('\r\n');
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
  a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const fileName = s => (s.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'list') + '.csv';
const TEMPLATE = COLS.join(',') + '\r\n' +
  '1,Documents,Passports,4,Have at home,Critical,Can\'t travel without them,Check expiry dates,no,1\r\n' +
  '2,Toiletries,Sun cream SPF50,2 bottles,Need to buy,Important,,,no,1\r\n';

/* ---------- Sheets: new trip, trip info, item editor ---------- */
const sheet = $('#sheet');
function openSheet(title, body, mount) {
  sheet.innerHTML = `<div class="sheet-h"><h2 id="sheetTitle">${h(title)}</h2><button class="iconbtn" data-act="closesheet" aria-label="Close">✕</button></div><div class="sheet-b">${body}</div>`;
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  if (mount) mount();
}
function closeSheet() { if (sheet.open) sheet.close(); }
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

function newTripSheet() {
  const others = DB.trips;
  openSheet('New trip', `
    <label for="n_name">Trip name *</label><input id="n_name" placeholder="e.g. Lisbon, Easter 2027" autocomplete="off">
    <label for="n_sub">Details (optional)</label><input id="n_sub" placeholder="e.g. LGW → LIS · Airbnb · 5 nights" autocomplete="off">
    <div class="row2"><div><label for="n_s">First day</label><input type="date" id="n_s"></div><div><label for="n_e">Last day</label><input type="date" id="n_e"></div></div>
    <p id="n_msg" class="crit-txt" role="status"></p>
    <h3>How do you want to start?</h3>
    <button class="btn primary block" id="n_csv">Upload a CSV file</button>
    <input type="file" id="n_file" accept=".csv,text/csv,text/plain" hidden>
    <p class="small">Same columns as the Barbados list: ${COLS.join(', ')}. Only <b>item</b> is required. <button class="link" id="n_tpl">Download a template</button></p>
    ${others.length ? `<label for="n_from">Or reuse another trip’s items (all unticked)</label>
      <select id="n_from">${others.map(t => `<option value="${h(t.uid)}">${h(t.name)} (${t.items.length} items)</option>`).join('')}</select>
      <button class="btn block" id="n_dup">Copy those items</button>` : ''}
    <button class="btn block" id="n_blank">Start with an empty list</button>`, () => {
    const meta = () => ({name:clean($('#n_name').value), sub:clean($('#n_sub').value), start:$('#n_s').value, end:$('#n_e').value});
    const need = () => {
      const m = meta();
      if (!m.name) { $('#n_msg').textContent = 'Give the trip a name first.'; $('#n_name').focus(); return null; }
      return m;
    };
    const create = (m, rows, note) => {
      const t = newTrip(m, rows, false);
      DB.trips.push(t); persist(); closeSheet();
      toast(note || `Created “${t.name}”`);
      openTrip(t.uid, {tab: t.items.length ? 'dash' : 'list'});
    };
    $('#n_tpl').onclick = () => download('holiday_list_template.csv', TEMPLATE);
    $('#n_csv').onclick = () => { if (need()) $('#n_file').click(); };
    $('#n_file').onchange = async e => {
      const f = e.target.files[0], m = need();
      if (!f || !m) return;
      const res = rowsFromCSV(await f.text());
      e.target.value = '';
      if (res.error) { $('#n_msg').textContent = res.error; return; }
      const count = normItems(res.rows).length;
      if (!count) { $('#n_msg').textContent = 'No rows with an item name were found.'; return; }
      const skipped = res.rows.length - count;
      create(m, res.rows, `Imported ${plural(count, 'item')}` + (skipped ? ` (${skipped} empty rows skipped)` : ''));
    };
    if ($('#n_dup')) $('#n_dup').onclick = () => {
      const m = need(), src = getTrip($('#n_from').value);
      if (m && src) create(m, src.items.map(it => ({...it, packed:'no'})), `Copied ${plural(src.items.length, 'item')} from ${src.name}`);
    };
    $('#n_blank').onclick = () => { const m = need(); if (m) create(m, []); };
  });
}

function tripInfoSheet() {
  const t = UI.trip;
  openSheet('Trip details', `
    <label for="i_name">Trip name</label><input id="i_name" value="${h(t.name)}">
    <label for="i_sub">Details</label><input id="i_sub" value="${h(t.sub)}">
    <div class="row2"><div><label for="i_s">First day</label><input type="date" id="i_s" value="${h(t.start)}"></div><div><label for="i_e">Last day</label><input type="date" id="i_e" value="${h(t.end)}"></div></div>
    <button class="btn primary block" id="i_save">Save</button>`, () => {
    $('#i_save').onclick = () => {
      t.name = clean($('#i_name').value) || t.name;
      t.sub = clean($('#i_sub').value);
      t.start = $('#i_s').value; t.end = $('#i_e').value;
      persist(); closeSheet(); renderTitle(); renderTab(); toast('Saved');
    };
  });
}

function editItem(id) {
  const t = UI.trip, it = id != null ? itemById(t, id) : null, cats = catOrder(t);
  const opts = (list, cur) => (list.some(o => o.k === cur) ? '' : `<option>${h(cur)}</option>`) +
    list.map(o => `<option value="${h(o.k)}" ${o.k === cur ? 'selected' : ''}>${h(o.k)}</option>`).join('');
  openSheet(it ? 'Edit item' : 'Add an item', `<form id="ef">
    <label for="e_item">Item *</label><textarea id="e_item" rows="2">${h(it?.item)}</textarea>
    <label for="e_cat">Category</label><input id="e_cat" list="e_cats" value="${h(it?.category || UI.cat || cats[0] || '')}" autocomplete="off">
    <datalist id="e_cats">${cats.map(c => `<option value="${h(c)}">`).join('')}</datalist>
    <label for="e_qty">Quantity</label><input id="e_qty" value="${h(it?.qty)}" autocomplete="off">
    <div class="row2" style="margin:0">
      <div><label for="e_src">Source</label><select id="e_src">${opts(SRC, it?.source || 'Have at home')}</select></div>
      <div><label for="e_crit">Criticality</label><select id="e_crit">${opts(CRIT, it?.criticality || 'Important')}</select></div>
    </div>
    <label for="e_why">Why it’s critical</label><textarea id="e_why" rows="2">${h(it?.why_critical)}</textarea>
    <label for="e_notes">Notes</label><textarea id="e_notes" rows="3">${h(it?.notes)}</textarea>
    <label class="check"><input type="checkbox" id="e_p" ${it && isPacked(t, it.id) ? 'checked' : ''}> Packed</label>
    <p id="e_msg" class="crit-txt" role="status"></p>
    <div class="row2"><button type="submit" class="btn primary">${it ? 'Save' : 'Add item'}</button>${it ? '<button type="button" class="btn danger" id="e_del">Delete</button>' : '<button type="button" class="btn" data-act="closesheet">Cancel</button>'}</div>
  </form>`, () => {
    $('#ef').onsubmit = e => {
      e.preventDefault();
      const v = {item:clean($('#e_item').value), category:clean($('#e_cat').value) || 'General', qty:clean($('#e_qty').value),
        source:$('#e_src').value, criticality:$('#e_crit').value, why_critical:clean($('#e_why').value), notes:clean($('#e_notes').value)};
      if (!v.item) { $('#e_msg').textContent = 'The item needs a name.'; $('#e_item').focus(); return; }
      let target = it;
      if (it) {
        if (it.category !== v.category) it.sort_order = maxSort(t, v.category, it.id) + 1;
        Object.assign(it, v);
      } else {
        target = {id: Math.max(0, ...t.items.map(i => i.id)) + 1, ...v, sort_order: maxSort(t, v.category) + 1};
        t.items.push(target);
      }
      const want = $('#e_p').checked;
      if (want !== isPacked(t, target.id)) setPacked(t, target.id, want);
      persist(); closeSheet();
      toast(it ? 'Saved' : `Added to ${v.category}`);
      UI.focus.key = '';
      renderTitle(); if (!$('#filters').hidden) renderChips(); renderTab();
    };
    if ($('#e_del')) $('#e_del').onclick = () => {
      const idx = t.items.indexOf(it), st = t.state[it.id];
      t.items.splice(idx, 1);
      delete t.state[it.id];
      UI.open.delete(it.id);
      persist(); closeSheet();
      const refresh = () => { UI.focus.key = ''; renderTitle(); if (!$('#filters').hidden) renderChips(); renderTab(); };
      refresh();
      toast(`Deleted “${it.item.slice(0, 28)}${it.item.length > 28 ? '…' : ''}”`, 'Undo', () => {
        t.items.splice(idx, 0, it);
        if (st) t.state[it.id] = st;
        persist(); refresh();
      });
    };
  });
}

/* ---------- Toast & theme ---------- */
let toastTimer;
function toast(msg, label, fn, ms = 2600) {
  const el = $('#toast');
  el.innerHTML = `<span>${h(msg)}</span>${label ? `<button class="tbtn">${h(label)}</button>` : ''}`;
  el.hidden = false;
  if (label) el.querySelector('.tbtn').onclick = () => { el.hidden = true; fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, label ? Math.max(ms, 7000) : ms);
}

const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const v = DB.settings.theme, r = document.documentElement;
  if (v === 'system') delete r.dataset.theme; else r.dataset.theme = v;
  const dark = v === 'dark' || (v === 'system' && darkMQ.matches);
  $('#themeColor').content = dark ? '#0f1216' : '#f6f7f9';
}
darkMQ.addEventListener && darkMQ.addEventListener('change', applyTheme);

/* ---------- Actions (event delegation) ---------- */
const ACT = {
  toggle(b, id) {
    const row = b.closest('.row'), open = !UI.open.has(id);
    open ? UI.open.add(id) : UI.open.delete(id);
    row.classList.toggle('open', open);
    b.setAttribute('aria-expanded', open);
    row.querySelector('.details').hidden = !open;
  },
  collapse(b) { const c = b.dataset.cat; UI.collapsed.has(c) ? UI.collapsed.delete(c) : UI.collapsed.add(c); renderList(); },
  f(b) {
    const k = b.dataset.k, v = b.dataset.v;
    if (k === 'cat') UI.cat = v; else UI[k] = UI[k] === v ? '' : v;
    renderChips();
    if (k === 'cat') { const p = $('#cchips [aria-pressed="true"]'); if (p) p.scrollIntoView({inline:'center', block:'nearest'}); }
    renderTab();
    window.scrollTo(0, 0);
  },
  clearf() { resetFilters(); renderChips(); renderTab(); },
  tab(b) { setTab(b.dataset.v); },
  quick(b) { resetFilters(); UI[b.dataset.k] = b.dataset.v; setTab('list'); },
  back: goHome,
  open(b) { openTrip(b.dataset.uid); },
  add() { editItem(null); },
  edit(b, id) { editItem(id); },
  newtrip: newTripSheet,
  paste() { pasteSheet('Paste a link or code', 'Paste a list link (adds a trip) or a ticks code (merges progress). Tip: if you use the Home Screen app, paste links here rather than opening them in the browser.'); },
  seed() { DB.trips.unshift(newTrip(SEED_META, SEED, true)); persist(); renderHome(); },
  theme() {
    const order = ['system', 'light', 'dark'];
    DB.settings.theme = order[(order.indexOf(DB.settings.theme) + 1) % 3];
    persist(); applyTheme();
    toast({system:'Theme: follow phone', light:'Theme: light', dark:'Theme: dark'}[DB.settings.theme]);
  },
  settheme(b) { DB.settings.theme = b.dataset.v; persist(); applyTheme(); renderMore(); },
  fdone: focusDone, fskip: focusSkip, fback: focusBack,
  frestart() { UI.focus.key = ''; renderFocus(); },
  closesheet: closeSheet,
  async mkshare() {
    const t = UI.trip, url = baseURL() + '#t=' + await pack(tripPayload(t, $('#shTicks').checked));
    showOut('#shOut', url, `${t.name} list`, `Our ${t.name} packing list. Open the link and tap “Add to this phone”.`);
  },
  async mkstatus() {
    const t = UI.trip, code = await statusPayload(t);
    showOut('#stOut', code, `${t.name} ticks`, `Ticks for ${t.name}${DB.settings.device ? ' from ' + DB.settings.device : ''}. In Holiday Lists: open the trip › More › Import ticks › paste this code:`);
  },
  impstatus() { pasteSheet('Import ticks', 'Paste the ticks code (or link) someone sent you.'); },
  copyout(b) { copyText(b.closest('[id]')._payload.text); },
  shareout(b) {
    const {text, title, msg} = b.closest('[id]')._payload;
    navigator.share(text.startsWith('http') ? {title, text:msg, url:text} : {title, text:msg + '\n\n' + text}).catch(() => {});
  },
  tripinfo: tripInfoSheet,
  csv() { download(fileName(UI.trip.name), toCSV(UI.trip)); },
  untick() {
    const t = UI.trip;
    if (!confirm(`Untick all ${countPacked(t)} packed items in “${t.name}”?\n\nIf you later send your ticks, the other phone will be unticked too.`)) return;
    const now = Date.now();
    t.items.forEach(it => { if (isPacked(t, it.id)) t.state[it.id] = {p:0, t:now}; });
    persist(); UI.focus.key = ''; renderTitle(); toast('Everything unticked');
  },
  restore() {
    const t = UI.trip;
    if (!confirm(`Restore “${t.name}” to its original list?\n\nThis removes your added/edited items and clears all ticks on this phone.`)) return;
    Object.assign(t, originalOf(t));
    persist(); UI.open.clear(); UI.focus.key = ''; renderTitle(); toast('Original list restored');
  },
  deltrip() {
    const t = UI.trip;
    if (!confirm(`Delete “${t.name}” from this phone?\n\nThis can’t be undone. Other phones keep their copies.`)) return;
    DB.trips.splice(DB.trips.indexOf(t), 1);
    persist(); showHome(); toast(`Deleted “${t.name}”`);
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT' || b.disabled) return;
  const row = b.closest('.row');
  const fn = ACT[b.dataset.act];
  if (fn) fn(b, row ? +row.dataset.id : null, e);
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'tick') {
    const row = e.target.closest('.row');
    onTick(+row.dataset.id, e.target.checked, row);
  }
});
document.addEventListener('keydown', e => {
  if (UI.tab !== 'focus' || !UI.trip || sheet.open || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') focusDone();
  else if (e.key === 'ArrowLeft') focusSkip();
});

let qTimer;
$('#q').addEventListener('input', e => {
  $('#qx').hidden = !e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { UI.q = e.target.value.trim(); renderTab(); }, 150);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#qx').addEventListener('click', () => { $('#q').value = ''; UI.q = ''; $('#qx').hidden = true; renderTab(); $('#q').focus(); });

window.addEventListener('popstate', e => {
  if (e.state && e.state.v === 'trip' && getTrip(e.state.uid)) openTrip(e.state.uid, {push:false, tab:UI.trip ? UI.tab : undefined});
  else showHome();
});
if (window.ResizeObserver) new ResizeObserver(measureHdr).observe($('#tripHdr'));

/* ---------- PWA: generated icons + manifest, and the offline service worker (sw.js) ---------- */
function makeIcon(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d'), s = size;
  const rr = (X, Y, W, H, R) => { x.beginPath(); if (x.roundRect) x.roundRect(X, Y, W, H, R); else x.rect(X, Y, W, H); };
  x.fillStyle = '#0b63c4'; x.fillRect(0, 0, s, s);
  x.strokeStyle = '#fff'; x.lineWidth = s * .05;
  rr(s * .38, s * .2, s * .24, s * .18, s * .04); x.stroke();
  x.fillStyle = '#fff'; rr(s * .2, s * .32, s * .6, s * .46, s * .07); x.fill();
  x.strokeStyle = '#0b63c4'; x.lineWidth = s * .065; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(s * .35, s * .55); x.lineTo(s * .46, s * .66); x.lineTo(s * .66, s * .45); x.stroke();
  return c.toDataURL('image/png');
}
function setupPWA() {
  try {
    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon'; apple.href = makeIcon(180);
    document.head.append(apple);
    if (hosted()) {
      const base = new URL('./', location.href).href;
      const manifest = {name:'Holiday Lists', short_name:'Holiday', start_url:base, scope:base, display:'standalone',
        background_color:'#0f1216', theme_color:'#0b63c4',
        icons:[{src:makeIcon(192), sizes:'192x192', type:'image/png'}, {src:makeIcon(512), sizes:'512x512', type:'image/png', purpose:'any maskable'}]};
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.append(link);
    }
  } catch (e) {}
  if (hosted() && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ---------- Boot ---------- */
applyTheme();
setupPWA();
const bootHash = location.hash;
history.replaceState({v:'home'}, '', location.pathname + location.search);
const last = DB.settings.last;
if (last && getTrip(last.uid)) openTrip(last.uid, {tab:last.tab}); else showHome();
if (bootHash.startsWith('#t=') || bootHash.startsWith('#s=')) {
  readCode(bootHash).then(r => {
    if (!r) return toast('That link couldn’t be read. Ask for it to be sent again.', null, null, 6000);
    r.kind === 'trip' ? importTripSheet(r.data) : statusSheet(r.data);
  });
}
})();
